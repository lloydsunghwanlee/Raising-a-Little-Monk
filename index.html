<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동자스님 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 화면 게임. 위 HUD, 가운데 큰 마당/텃밭(옆으로 넘김), 아래 능력치 띠와 기능 독. 기능 창은 능력치 띠 자리에서 열려 캐릭터가 계속 보임 */
:root{
  --bg:#E3EBE4; --card:#FAFCF8; --card2:#EEF3ED; --ink:#3A2E28; --muted:#74685E; --line:#D0D9CF;
  --robe:#E0843A; --green:#3B8673; --red:#BF4A3E; --blue:#2E5C88; --gold:#D29A2E; --pink:#E0849B;
  --g-c:#7E858B; --g-u:#2F8F58; --g-r:#3567B8; --g-l:#C98A12;
  --on-accent:#FFFFFF; --shadow:0 2px 0 rgba(58,46,40,.14);
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131B21; --card:#1D2830; --card2:#25323B; --ink:#EFE7DA; --muted:#A99E92; --line:#34444E;
  --robe:#F09A50; --green:#6CC0A7; --red:#E57B6E; --blue:#86AEDA; --gold:#EDC468; --pink:#F2A7BA;
  --g-c:#A7AEB4; --g-u:#62C489; --g-r:#7EA6EE; --g-l:#F0BE4E;
  --on-accent:#1A1410; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131B21; --card:#1D2830; --card2:#25323B; --ink:#EFE7DA; --muted:#A99E92; --line:#34444E;
  --robe:#F09A50; --green:#6CC0A7; --red:#E57B6E; --blue:#86AEDA; --gold:#EDC468; --pink:#F2A7BA;
  --g-c:#A7AEB4; --g-u:#62C489; --g-r:#7EA6EE; --g-l:#F0BE4E;
  --on-accent:#1A1410; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding-block:8px}

/* HUD */
.hud{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.who{display:flex;align-items:baseline;gap:6px;min-width:0}
.who h1{font-size:1.35rem;color:var(--robe);white-space:nowrap}
.who span{color:var(--muted);font-size:.82rem;white-space:nowrap}
.meta{display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-family:var(--f-display);font-weight:400;font-size:.95rem}
.yeop{width:14px;height:14px;border-radius:50%;background:#E3B44C;position:relative;display:inline-block;box-shadow:inset 0 0 0 2px rgba(110,70,10,.35)}
.yeop::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;transform:translate(-50%,-50%);background:var(--card)}
.quest{flex:none;font-size:.82rem;background:color-mix(in srgb,var(--gold) 18%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:12px;padding:4px 10px;display:flex;justify-content:space-between;gap:8px}
.quest b{font-family:var(--f-display);font-weight:400}

/* 무대 (마당/텃밭) */
.views{flex:1 1 auto;min-height:150px;position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:#CFE3EA}
.pages{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;scroll-snap-align:start;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.page svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
:root[data-theme="dark"] .page svg.scene{filter:brightness(.84) saturate(.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .page svg.scene{filter:brightness(.84) saturate(.92)}}
.hero{position:absolute;left:50%;bottom:4%;height:64%;aspect-ratio:200/232;transform:translateX(calc(-50% + var(--x,0px)));transition:transform 2.6s ease-in-out;background:none;border:0;padding:0;z-index:3}
.hero .bob{height:100%;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.hero.flip svg{transform:scaleX(-1)}
.hero.hop .bob{animation:hop .45s ease-out 1}
.hero svg,.mini svg{width:100%;height:100%;display:block;overflow:visible}
.eyes{animation:blink 4.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2%) scale(1.01,.99)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-12%) scale(1.04,.96)}100%{transform:translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.spark{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.bubble{position:absolute;left:50%;bottom:calc(4% + 64% + 1%);transform:translateX(calc(-50% + var(--x,0px)));background:#FFFDF8;color:#3A2E28;border:2px solid #6B4B3E;border-radius:16px;padding:4px 12px;font-size:.88rem;max-width:70%;text-align:center;z-index:4;transition:opacity .3s,transform 2.6s ease-in-out;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:11px;height:11px;background:#FFFDF8;border-right:2px solid #6B4B3E;border-bottom:2px solid #6B4B3E;transform:translateX(-50%) rotate(45deg)}
.bubble[data-off]{opacity:0}
.fx{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.fx i{position:absolute;top:-6%;display:block;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx,20px),118cqh) rotate(260deg)}}
.views{container-type:size}
.corner{position:absolute;z-index:5;display:flex;gap:5px}
.corner.tl{left:8px;top:8px}.corner.tr{right:8px;top:8px}
.corner .pill{background:rgba(255,253,248,.9);color:#3A2E28;border-color:rgba(90,62,51,.22)}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:6;border:0;border-radius:999px;background:rgba(255,253,248,.9);color:#3A2E28;padding:8px 10px;font-family:var(--f-display);font-size:.9rem;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.navbtn.r{right:8px}.navbtn.l{left:8px;top:32%}
.dots{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;gap:6px;z-index:6}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dots i[data-on]{background:#E0843A}
.pop{position:absolute;z-index:8;font-family:var(--f-display);color:#7A4E0C;background:#FFF4D2;border-radius:10px;padding:0 7px;pointer-events:none;animation:popup 1.1s ease-out forwards;border:1px solid #E3B44C}
@keyframes popup{0%{transform:translateY(0) scale(.6)}20%{transform:translateY(-8px) scale(1.1)}100%{transform:translateY(-36px);opacity:0}}

/* 텃밭 */
.field{position:absolute;left:4%;right:4%;bottom:6%;top:47%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:4% 3%;z-index:3}
.plot{position:relative;border:0;padding:0;border-radius:18px;background:radial-gradient(ellipse at 50% 85%,#7A5536 0 55%,#6A472B 56% 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 0 rgba(70,45,25,.35);overflow:visible;display:block}
.plot::before{content:"";position:absolute;left:10%;right:10%;bottom:16%;height:34%;border-radius:50%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 6px,transparent 6px 12px)}
.plot .plant{position:absolute;left:50%;bottom:22%;width:92%;height:150%;transform:translateX(-50%);pointer-events:none}
.plot .plant svg{width:100%;height:100%;overflow:visible}
.plot .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:rgba(255,253,248,.95);color:#3A2E28;border-radius:999px;padding:0 8px;font-size:.74rem;white-space:nowrap;border:1px solid rgba(90,62,51,.25);font-variant-numeric:tabular-nums;z-index:2}
.plot.ready .tag{background:#FFE7A6;border-color:#D49A1E;font-family:var(--f-display)}
.plot.locked{background:repeating-linear-gradient(45deg,rgba(120,90,60,.35) 0 8px,rgba(120,90,60,.2) 8px 16px);box-shadow:none;border:2px dashed rgba(90,62,51,.4)}
.plot.locked .tag{bottom:40%}
.sway{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.farmhero{position:absolute;right:4%;top:18%;height:28%;aspect-ratio:200/232;z-index:4;pointer-events:none}

/* 능력치 띠 */
.strip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px 11px;display:grid;gap:7px}
.r2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--muted);gap:6px;margin-bottom:3px}
.lbl b{color:var(--ink);font-weight:400;font-family:var(--f-display);font-size:.9rem}
.bar{height:9px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line);position:relative}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--robe);transition:width .5s}
.apt .bar>i{background:linear-gradient(90deg,var(--gold),var(--robe))}
.karma .bar{background:linear-gradient(90deg,color-mix(in srgb,var(--red) 25%,var(--card2)),var(--card2) 50%,color-mix(in srgb,var(--green) 25%,var(--card2)))}
.karma .mark{position:absolute;top:-2px;width:6px;height:11px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .5s}
.stats6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.st{background:var(--card2);border-radius:10px;padding:3px 5px 5px;text-align:center}
.st small{display:block;font-size:.7rem;color:var(--muted);white-space:nowrap}
.st b{font-family:var(--f-display);font-weight:400;font-size:1rem;font-variant-numeric:tabular-nums;line-height:1.1}
.st .bar{height:4px;border:0;margin-top:2px}
.cond{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cond .bar{height:6px}
.cond .lbl{margin-bottom:2px}
.warn{color:var(--red)!important}

/* 기능 창 */
.sheet{flex:0 0 56%;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;gap:8px;flex:none}
.sheet-h h2{font-size:1.15rem}
.x{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:3px 10px;font-family:var(--f-display)}
.sheet-b{overflow:auto;padding:4px 12px 14px;display:grid;gap:12px;align-content:start;min-height:0}
#app.open .strip{display:none}
#app:not(.open) .sheet{display:none}
.dock{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.dock button{border:0;background:none;border-radius:12px;padding:6px 2px 5px;font-family:var(--f-display);font-size:.9rem;color:var(--muted);display:grid;justify-items:center;gap:1px}
.dock button span{font-size:1.15rem;line-height:1}
.dock button[aria-pressed="true"]{background:var(--robe);color:var(--on-accent)}
.dock button.go{background:color-mix(in srgb,var(--robe) 16%,var(--card));color:var(--ink)}

.sub{color:var(--muted);font-size:.82rem;margin:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border:2px dashed var(--line);background:var(--card2);border-radius:12px;padding:4px 1px;text-align:center;display:grid;justify-items:center;gap:0}
.day small{color:var(--muted);font-size:.72rem}
.day .ic{font-size:1.2rem;line-height:1.3}
.day .nm{font-size:.66rem;line-height:1.2;white-space:nowrap;overflow:hidden;max-width:100%}
.day[aria-pressed="true"]{border:2px solid var(--robe);background:color-mix(in srgb,var(--robe) 13%,var(--card))}
.grp{display:grid;gap:5px}
.grp h3{font-size:.86rem;color:var(--muted);letter-spacing:.06em}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:5px}
.act{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 8px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:0 7px;align-items:center}
.act .ic{font-size:1.2rem;grid-row:span 2}
.act b{font-weight:400;font-family:var(--f-display);font-size:.92rem}
.act small{color:var(--muted);font-size:.7rem;line-height:1.25}
.act:hover{border-color:var(--robe)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:8px 13px;font-family:var(--f-display);font-size:.98rem}
.btn.primary{background:var(--robe);color:var(--on-accent);border-color:transparent;box-shadow:var(--shadow)}
.btn.big{width:100%;padding:12px;font-size:1.1rem}
.btn.sm{padding:4px 10px;font-size:.84rem}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:7px 9px;background:var(--card)}
.item .ic{font-size:1.5rem;width:38px;height:38px;display:grid;place-items:center}
.item .ic svg{width:34px;height:34px}
.item b{font-family:var(--f-display);font-weight:400;font-size:.95rem}
.item small{display:block;color:var(--muted);font-size:.74rem;line-height:1.35}
.item.bad{background:color-mix(in srgb,var(--red) 6%,var(--card))}
.gr{display:inline-block;font-size:.68rem;border-radius:6px;padding:0 5px;margin-left:4px;color:#fff;vertical-align:1px;font-family:var(--f-body)}
.gr.c{background:var(--g-c)}.gr.u{background:var(--g-u)}.gr.r{background:var(--g-r)}.gr.l{background:linear-gradient(90deg,#C98A12,#E8B83A);}
.item.l,.wear.l{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--g-l) 55%,transparent)}
.item.r,.wear.r{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--g-r) 40%,transparent)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:3px 9px;font-size:.8rem}
.chip svg{width:18px;height:18px}
.wears{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.wear{border:1px solid var(--line);border-radius:14px;padding:7px 5px;display:grid;gap:3px;justify-items:center;text-align:center;background:var(--card)}
.wear .ic{font-size:1.4rem}
.wear b{font-weight:400;font-family:var(--f-display);font-size:.88rem}
.wear[data-on]{outline:2px solid var(--robe)}
.wear small{color:var(--muted);font-size:.7rem;line-height:1.3}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.gal div{border:1px solid var(--line);border-radius:12px;padding:6px 9px;background:var(--card2);font-size:.8rem}
.gal div b{display:block;font-family:var(--f-display);font-weight:400}
.gal div.lock{color:var(--muted);border-style:dashed}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
.kv span{background:var(--card2);border-radius:10px;padding:5px 9px;font-size:.8rem}
.kv b{font-weight:400;font-family:var(--f-display)}

/* 극장: 일하는 장면, 이벤트 */
#th{position:fixed;inset:0;z-index:40;background:rgba(24,19,16,.72);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.thc{width:min(520px,100%);display:grid;gap:8px}
.ths{position:relative;aspect-ratio:4/3;max-height:52vh;width:100%;margin:0 auto;border-radius:20px;overflow:hidden;border:3px solid #F4E9D6;background:#CFE3EA;container-type:size}
.ths>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.ths .actor{position:absolute;bottom:6%;height:62%;aspect-ratio:200/232;left:50%;transform:translateX(-50%)}
.ths .actor svg{width:100%;height:100%;overflow:visible}
.ths .prop{position:absolute;pointer-events:none}
.ths .prop svg{width:100%;height:100%;overflow:visible}
.banner{position:absolute;left:50%;top:7%;transform:translateX(-50%);background:#FFFDF8;color:#3A2E28;border:2px solid #6B4B3E;border-radius:999px;padding:3px 16px;font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;z-index:6;animation:drop .4s ease-out}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.result{position:absolute;right:5%;top:22%;z-index:7;font-family:var(--f-display);font-size:1.5rem;padding:2px 14px;border-radius:14px;transform:rotate(-6deg);animation:stamp .35s ease-out both;animation-delay:var(--d,.6s)}
.result.great{background:#FFE08A;color:#7A4E0C;border:3px solid #C98A12}
.result.ok{background:#E4F3E8;color:#2F6B4F;border:3px solid #6FB08A}
.result.fail{background:#F5DCD8;color:#8A3A30;border:3px solid #D07A6E}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.coinfly{position:absolute;z-index:8;width:13%;aspect-ratio:1;left:56%;bottom:30%;animation:coinup 1s ease-out both;animation-delay:var(--d,.4s)}
@keyframes coinup{0%{transform:translateY(30%) scale(.3);opacity:0}30%{opacity:1;transform:translateY(-40%) scale(1.1) rotateY(0)}60%{transform:translateY(-55%) rotateY(180deg)}100%{transform:translateY(-70%) rotateY(360deg);opacity:1}}
.pips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pip{background:rgba(255,253,248,.15);color:#F4E9D6;border-radius:10px;text-align:center;font-size:.74rem;padding:3px 0;border:1px solid rgba(255,253,248,.25)}
.pip[data-s="now"]{background:#F09A50;color:#1A1410;border-color:#F09A50}
.pip[data-s="done"]{background:rgba(255,253,248,.35);color:#1A1410}
.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.box .who{font-family:var(--f-display);color:var(--robe);font-size:1rem}
.box p{margin:0}
.box .note{color:var(--muted);font-size:.84rem}
.box h2{font-size:1.25rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.d{border-radius:999px;padding:1px 8px;font-size:.8rem;font-variant-numeric:tabular-nums;border:1px solid}
.d.up{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 10%,transparent)}
.d.dn{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.btns{display:grid;gap:6px}
.choice{text-align:left;display:grid;gap:1px}
.choice small{font-family:var(--f-body);font-size:.78rem;opacity:.8}
.thctl{display:flex;gap:6px;justify-content:flex-end}
.thctl button{background:rgba(255,253,248,.16);color:#F4E9D6;border:1px solid rgba(255,253,248,.3);border-radius:10px;padding:3px 10px;font-size:.82rem}
.shopcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

.a-lie{transform:translateX(-50%) rotate(-82deg) !important;transform-origin:50% 80%;bottom:-6%!important}

function gear(){return ['hat','robe','item'].map(c=>WEAR[c].list.find(x=>x.id===S.wear[c])).filter(Boolean)}
function bonusMult(stat,act){
  let m=1;
  for(const it of gear()){const b=it.bonus;if(!b)continue;if(b.all)m*=b.all;if(b.stat&&b.stat[stat])m*=b.stat[stat];if(act&&b.act&&b.act[act])m*=b.act[act]}
  for(const r of S.relics){const R=RELICS[r];if(R&&R.stat&&R.stat[stat])m*=R.stat[stat]}
  return m;
}
function bonusSum(key){let v=0;for(const it of gear()){if(it.bonus&&it.bonus[key])v+=it.bonus[key]}return v}
function karmaMult(){let m=1;for(const it of gear())if(it.bonus&&it.bonus.karma)m*=it.bonus.karma;return m}
function tiredMult(){let m=1;for(const it of gear())if(it.bonus&&it.bonus.tired)m*=it.bonus.tired;return m}

function applyFx(fx,mult=1,act=null){
  const d={};
  for(const k in fx){let v=fx[k];
    if(STAT_KEYS.includes(k)){if(v>0)v=v*mult*bonusMult(k,act)*(1-S.st[k]/130);const o=S.st[k];S.st[k]=clamp(o+v,0,100);d[k]=S.st[k]-o}
    else if(k==='karma'){if(v>0){v*=karmaMult();if(S.karma>0)v*=(1-S.karma/160)}const o=S.karma;S.karma=clamp(o+v,-100,100);d[k]=S.karma-o}
    else if(k==='coin'){const o=S.coin;S.coin=Math.max(0,Math.round(o+v));d[k]=S.coin-o}
    else if(['full','mood','tired','health'].includes(k)){if(k==='tired'&&v>0)v*=tiredMult();const o=S[k];S[k]=clamp(o+v,0,100);d[k]=S[k]-o}
  }
  return d;
}

  if(se==='summer'){for(let i=0;i<6;i++){const e=document.createElement('i');e.style.cssText=`left:${rand(5,95)}%;top:${rand(40,80)}%;width:5px;height:5px;border-radius:50%;background:#FFF3A0;box-shadow:0 0 8px #FFE96A;animation:twinkle ${rand(2,4)}s ease-in-out infinite;`;fx.appendChild(e)}}

function renderDock(){

function plotState(pl){if(!pl.c)return null;const p=(Date.now()-pl.t0)/pl.dur;return {p:Math.min(1,p),left:Math.max(0,pl.t0+pl.dur-Date.now())}}
function fmtLeft(ms){const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h}시간 ${m}분`:m?`${m}분 ${ss}초`:`${ss}초`}
function plotCost(){const n=S.plots.filter(p=>!p.lock).length;return n===3?50:n===4?90:140}
let fieldSig='';
function renderField(force){
  const sig=S.plots.map(pl=>pl.lock?'L':!pl.c?'E':pl.c+Math.floor((plotState(pl).p)*20)).join('|')+plotCost();
  if(sig!==fieldSig||force){fieldSig=sig;
    $('#field').innerHTML=S.plots.map((pl,i)=>{
      if(pl.lock) return `<button class="plot locked" data-plot="${i}" aria-label="밭 늘리기"><span class="tag">🔒 ${plotCost()}닢에 넓히기</span></button>`;
      if(!pl.c) return `<button class="plot" data-plot="${i}" aria-label="빈 밭, 씨앗 심기"><span class="tag">씨앗 심기</span></button>`;
      const s=plotState(pl), c=CROPS[pl.c];
      return `<button class="plot ${s.p>=1?'ready':''}" data-plot="${i}" aria-label="${c.n}"><span class="plant">${plantSVG(pl.c,s.p)}</span><span class="tag" data-left="${i}">${s.p>=1?c.n+' 수확!':c.n+' '+fmtLeft(s.left)}</span></button>`}).join('');
  } else {
    S.plots.forEach((pl,i)=>{if(!pl.c||pl.lock)return;const s=plotState(pl);const t=document.querySelector(`[data-left="${i}"]`);if(t&&s.p<1)t.textContent=CROPS[pl.c].n+' '+fmtLeft(s.left)});
  }
}

function hasNeed(need,times=1){for(const k in need)if((S.crops[k]||0)<need[k]*times)return false;return true}

async function runWeek(){
  if(UI.busy||!S||S.done)return; UI.busy=true; UI.skip=false;
  if(UI.sheet)openSheet(UI.sheet);
  const tot={}; let found=0; const made=[]; const logs=[];
  try{
    for(let i=0;i<7;i++){
      const r=doDay(i); merge(tot,r.d); found+=r.coin; if(r.made)made.push(r.made); logs.push(r);
      if(!UI.skip&&UI.speed>0) await playDay(i,r);
    }
    render();
    await weekSummary(tot,found,made,logs);
    await weekEvents();
    S.week++;
    if(S.week>=WEEKS){save();await ending();return}
    if(month()===3&&wom()===1&&S.week>0){S.age++;await say(eventStage('yard','me','새봄'),'',`${nm()}가 한 살 더 먹어 ${S.age}살이 되었어요!\n남은 번뇌는 ${WEEKS-S.week}주예요.`)}
    save();
  } finally {thHide();UI.busy=false;render()}
  bubble(pick(['다음 주엔 뭐 해요?','휴, 한 주 끝!','오늘 공양은 뭐예요?']));
}
function doDay(i){
  let id=S.plan[i], a=ACTS[id]; const notes=[];
  // 하루 경과
  S.full=clamp(S.full-6,0,100);
  const hd={};
  if(S.full<=0){merge(hd,applyFx({health:-5,mood:-4}));notes.push('배가 너무 고파서 어지러워요…')}
  else if(S.full<25){merge(hd,applyFx({health:-2}))}
  else if(S.full>=50){merge(hd,applyFx({health:1}))}
  const daily={mood:bonusSum('mood'),health:bonusSum('health')}; merge(hd,applyFx(daily));
  if(S.health<=15||S.tired>=95){a=SICK;id='sick';notes.push(S.health<=15?'건강이 너무 나빠져 앓아누웠어요.':'너무 무리해서 쓰러졌어요.')}
  else if(S.mood<=10&&!['nap','hill','prank'].includes(id)&&Math.random()<.5){notes.push(`기분이 너무 나빠서 ${a.n} 대신 몰래 장난을 쳤어요.`);id='prank';a=ACTS.prank}
  let mult=1;
  if(!['nap','hill','prank','sick'].includes(id)){
    if(S.tired>=80){mult*=.5;notes.push('너무 피곤해서 꾸벅꾸벅…')}
    if(S.full<20){mult*=.6;notes.push('배가 고파서 힘이 안 나요.')}
    else if(S.full>=60){mult*=1.1}
    if(S.health<40){mult*=.6;notes.push('몸이 으슬으슬해요.')}
    if(S.mood<=15){mult*=.7}else if(S.mood>=80){mult*=1.15}
  }
  let res='ok';
  if(id!=='sick'){const roll=Math.random();
    if(mult<.75&&roll<.4){res='fail';mult*=.2}
    else if(roll>(mult>=1?.82:.92)){res='great';mult*=1.7}}
  const d=applyFx(a.fx,mult,id); merge(d,hd);
  let made=null, coin=0;
  if(id==='lantern'&&res!=='fail'){const q=clamp(Math.round(S.st.dex+rand(-5,22)+(res==='great'?15:0)+bonusSum('lanternQ')),5,100);S.lanterns.push(q);S.cnt.craft++;S.flags.lantern=1;made=`연등(${q}점)`}
  if(id==='beads'&&res!=='fail'){S.beads++;S.cnt.craft++;made='염주'}
  if(id==='farm'){S.plots.forEach(pl=>{if(pl.c)pl.t0-=(res==='great'?15:8)*60000})}
  if(id==='hill'){S.flags.hill=1;if(Math.random()<.2){S.crops.lettuce=(S.crops.lettuce||0)+1;made='산나물(상추)'}}
  if(id==='prank'){S.cnt.prank++;if(Math.random()<.25){S.cnt.caught++;merge(d,applyFx({karma:-2,mood:-10,pat:.5}));notes.push('주지스님께 딱 걸려 꿀밤 한 대!');res='fail'}}
  if(a.coin){const ch=a.coin[0]+bonusSum('coinChance');if(Math.random()<ch){coin=rand(a.coin[1],a.coin[2]);if(S.relics.includes('abacus'))coin=Math.round(coin*1.5);if(res==='great')coin*=2;S.coin+=coin;S.cnt.coinFound+=coin}}
  merge(d,applyFx({tired:-3}));
  S.cnt[id]=(S.cnt[id]||0)+1;
  const text=res==='fail'&&id!=='prank'?pick(['일이 영 손에 잡히지 않았어요.','실수 연발! 오늘은 잘 안 풀렸어요.','하다 말고 딴생각에 빠졌어요.']):pick(a.say);
  return {i,id,a,d,res,coin,made,notes,text};
}
async function playDay(i,r){
  const a=r.a, pr=propSVG(a.prop);
  const pips=`<div class="pips">${DAYS.map((n,k)=>`<div class="pip" data-s="${k<i?'done':k===i?'now':''}">${n}</div>`).join('')}</div>`;
  const resTxt={great:'대성공!',ok:'성공',fail:'실패…'}[r.res];
  const coin=r.coin?`<svg class="coinfly" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#E9B949" stroke="#8A5A12" stroke-width="3"/><rect x="15" y="15" width="10" height="10" fill="#F6E7C2" stroke="#8A5A12" stroke-width="2"/></svg><div class="banner" style="top:auto;bottom:8%;animation-delay:.5s">엽전 ${r.coin}닢 주웠어요!</div>`:'';
  const actorCls=a.anim+(a.anim==='a-lie'?' ':'');
  const stage=stageHTML({bg:bgSVG(a.bg,season()),actor:charSVG(),actorCls,props:[pr],banner:`${DAYS[i]}요일 · ${a.n}`,extra:`<div class="result ${r.res}" style="--d:${.9/UI.speed}s">${resTxt}</div>${coin}`});
  thShow(`<div class="thctl"><button data-fast>${UI.speed>=2?'보통 속도':'2배속'}</button><button data-skip>건너뛰기</button></div>${stage}${pips}<div class="box"><p>${r.text}</p>${r.made?`<p class="note">${r.made} 완성!</p>`:''}${r.notes.map(n=>`<p class="note">${n}</p>`).join('')}</div>`);
  th.querySelector('[data-fast]').onclick=e=>{UI.speed=UI.speed>=2?1:2;e.target.textContent=UI.speed>=2?'보통 속도':'2배속'};
  th.querySelector('[data-skip]').onclick=()=>{UI.skip=true};
  tok(r.res==='great'?1100:r.id==='yebul'?620:820);
  if(r.coin)setTimeout(()=>tok(1300),500);
  const t0=Date.now();
  while(Date.now()-t0<1900/UI.speed&&!UI.skip) await new Promise(res=>setTimeout(res,60));
}
async function weekSummary(tot,found,made,logs){
  const great=logs.filter(l=>l.res==='great').length, fail=logs.filter(l=>l.res==='fail').length;
  const madeTxt=made.length?`만든 것: ${made.join(', ')}`:'';
  render();
  await say(eventStage('yard','me',`${month()}월 ${wom()}주 결산`),'',`대성공 ${great}번, 실패 ${fail}번. ${found?`일하다 주운 엽전 ${found}닢!`:''}\n${madeTxt}`,{chips:tot,note:S.full<25?'배가 많이 고파요. 공양을 챙겨 주세요.':S.health<40?'건강이 나빠지고 있어요. 착한 밥과 낮잠이 필요해요.':''});
}

async function festival(){
  const L=[...S.lanterns].sort((a,b)=>b-a), goal=S.flags.festGoal||3, hung=L.slice(0,Math.max(goal,5)), met=L.length>=goal;
  const best=hung[0]||0, avg=hung.length?hung.reduce((a,b)=>a+b,0)/hung.length:0;
  const N=Math.max(14,hung.length+8);

function decideEnding(){
  const s=S.st, a=apt();
  if(S.flags.goldlotus&&S.karma>=20) return 'lotus';
  if(S.karma<=-40) return 'dokkaebi';
  if(a>=72&&S.karma>=55&&Math.min(s.wis,s.pat,s.com)>=55) return 'heir';
  if(S.cnt.snack>=30) return 'mukbang';
  if(S.relics.includes('abacus')&&S.cnt.buy>=4&&s.wit>=40) return 'peddler';
  const c=[];
  if(s.pat>=70&&s.wis>=45) c.push(['zen',s.pat]);
  if(s.wis>=70) c.push(['scholar',s.wis+(S.relics.includes('sutra')?10:0)]);
  if(s.com>=70&&S.karma>=20) c.push(['mercy',s.com]);
  if(s.dex>=70||S.cnt.craft>=40) c.push(['artisan',Math.max(s.dex,S.cnt.craft*2)]);
  if(S.cnt.harvest>=35&&s.str>=40) c.push(['farmer',s.str+S.cnt.harvest/2]);
  if(s.wit>=70) c.push(['jester',s.wit]);
  if(!c.length) return 'normal';
  c.sort((x,y)=>y[1]-x[1]); return c[0][0];
}

  popAt(el,`${c.n} +${y}`); tok(900);
  bubble(gold?'우와… 금빛이에요!':'우와, 풍년이에요!');
  if(gold) toast('황금 연꽃이 피었어요! 무언가 특별한 일이 일어날 것 같아요.');
  applyFx({mood:3}); save(); render();
}
function plant(k){
  if(!(S.seeds[k]>0))return; const pl=S.plots[seedPlot]; if(!pl||pl.c||pl.lock)return;
  S.seeds[k]--; pl.c=k; pl.t0=Date.now(); pl.dur=CROPS[k].min*60000;
  toast(`${CROPS[k].n}을(를) 심었어요 · ${CROPS[k].min>=60?CROPS[k].min/60+'시간':CROPS[k].min+'분'} 뒤에 거둬요`); tok(900);
  openSheet('seed'); save(); render(); goPage(1);
}
function expand(){const c=plotCost();const pl=S.plots.find(p=>p.lock);if(!pl)return;if(S.coin<c){toast(`엽전이 모자라요. 밭을 넓히려면 ${c}닢이 필요해요.`);return}S.coin-=c;delete pl.lock;toast('밭이 한 뙈기 늘었어요!');tok(1000);save();render(true)}
function sellCraft(kind,offer){
  let d={};
  if(kind==='lantern'){if(!S.lanterns.length)return;const low=Math.min(...S.lanterns);S.lanterns.splice(S.lanterns.indexOf(low),1);d=applyFx(offer?{karma:2,com:1}:{coin:8+Math.floor(low/6)})}
  else{if(!S.beads)return;S.beads--;d=applyFx(offer?{karma:2,wis:1}:{coin:10})}
  toast((offer?'불전에 올렸어요 · ':'팔았어요 · ')+Object.entries(d).filter(([k,v])=>Math.abs(v)>=.05).map(([k,v])=>`${NAME[k]} ${fmt(v)}`).join(', '));
  tok(offer?600:1000); save(); render();
}

/* ================= 타이틀 ================= */
function showTitle(){
  const sv=load(SAVE); const gal=load(GAL)||{};
  const T=$('#title');
  const demo={wear:{hat:'none',robe:'orange',item:'squirrel'},mood:80,karma:45,full:80,tired:0,health:90};
  T.innerHTML=`<div class="tcard"><div class="mini">${charSVG(demo)}</div><h1>동자스님 키우기</h1>
   <p class="sub">산사에 들어온 여섯 살 동자스님과 함께하는 번뇌 108주. 요일마다 할 일을 정하고, 밥을 챙기고, 텃밭을 가꾸며 동자스님의 앞날을 만들어 가요.</p>
   ${sv&&!sv.done?`<div class="btns"><button class="btn primary big" id="cont">${sv.name} 스님 이어서 키우기</button><button class="btn" id="fresh">새로 시작하기</button></div>`:
   `<label for="nameInput" class="sub">동자스님의 이름을 지어 주세요</label><input id="nameInput" maxlength="6" value="${pick(['도담','보리','연우','소담','다솜','해동'])}" autocomplete="off"><div class="btns"><button class="btn primary big" id="start">절에 들어가기</button></div>`}
   <p class="sub">엔딩 도감 ${Object.keys(gal).length} / ${Object.keys(ENDINGS).length}</p></div>`;
  T.hidden=false;
  const c=$('#cont'), f=$('#fresh'), s=$('#start');
  if(c)c.onclick=()=>{S=sv;migrate();T.hidden=true;lastSeason='';fieldSig='';render();welcomeBack()};
  if(f)f.onclick=()=>{try{localStorage.removeItem(SAVE)}catch(e){}showTitle()};
  if(s){const go=async()=>{const n=($('#nameInput').value||'').trim().slice(0,6)||'도담';newGame(n);T.hidden=true;lastSeason='';fieldSig='';UI.day=0;save();render();tok();
      UI.busy=true;
      await say(eventStage('yard','elder','산사에 온 걸 환영한다'),'큰스님',`오늘부터 너는 ${nm()}다. 이곳에서 번뇌 108주를 지내며 무엇이 될지는 네 마음에 달렸단다.`);
      await say(eventStage('yard','me','이렇게 키워요'),'',`아래 일정에서 월요일부터 일요일까지 할 일을 정하고 "한 주 시작하기"를 누르면 일하는 모습을 볼 수 있어요.\n마당을 옆으로 넘기면 텃밭이 나와요. 작물은 실제 시간으로 자라요.\n배가 고프면 건강이 나빠지니 공양을 꼭 챙겨 주세요.`,{btn:'시작하기'});
      thHide(); UI.busy=false; bubble('잘 부탁드려요, 스님!')};
    s.onclick=go;$('#nameInput').onkeydown=e=>{if(e.key==='Enter')go()}}
}
function migrate(){S.cnt=Object.assign({snack:0,craft:0,harvest:0,prank:0,meal:0,caught:0,buy:0,coinFound:0},S.cnt||{});S.flags=S.flags||{};S.seen=S.seen||{};S.relics=S.relics||[]}
function welcomeBack(){const ready=S.plots.filter(pl=>pl.c&&plotState(pl).p>=1).length;if(ready)toast(`자리를 비운 동안 작물 ${ready}개가 다 자랐어요! 텃밭으로 가 보세요.`)}

/* ================= 시작 ================= */
function boot(data){
  if(data&&data.S){S=data.S;migrate();$('#title').hidden=true;render()}
  else{const sv=load(SAVE);
    if(sv&&!sv.done&&sv.v===2){S=sv;migrate();render();showTitle()}
    else{newGame('도담');render();showTitle();S=null}
  }
  setInterval(tick,1000);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
window.__dz={get S(){return S},runWeek,UI};
})();
</script>
