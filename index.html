<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동자스님 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 산사 마당(무대)과 게이지가 왼쪽, 탭 패널이 오른쪽. 좁은 화면에선 한 줄로 쌓임 */
:root{
  --bg:#E4ECE6; --card:#FAFCF8; --card2:#EFF4EE; --ink:#3A2E28; --muted:#75695F; --line:#D2DBD1;
  --robe:#E0843A; --green:#3B8673; --red:#BF4A3E; --blue:#2E5C88; --gold:#D9A43C; --pink:#E58FA5;
  --on-accent:#FFFFFF; --shadow:0 2px 0 rgba(58,46,40,.12);
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131B21; --card:#1D2830; --card2:#24313A; --ink:#EFE7DA; --muted:#A99E92; --line:#33434D;
  --robe:#F09A50; --green:#6CC0A7; --red:#E57B6E; --blue:#86AEDA; --gold:#EDC468; --pink:#F2A7BA;
  --on-accent:#1A1410; --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131B21; --card:#1D2830; --card2:#24313A; --ink:#EFE7DA; --muted:#A99E92; --line:#33434D;
  --robe:#F09A50; --green:#6CC0A7; --red:#E57B6E; --blue:#86AEDA; --gold:#EDC468; --pink:#F2A7BA;
  --on-accent:#1A1410; --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
#app{max-width:1060px;margin:0 auto;padding-block:12px 32px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){#app{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.left{position:sticky;top:12px}}
.left,.right{display:grid;gap:12px;min-width:0}

/* 상단 */
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.who{display:flex;align-items:baseline;gap:8px;min-width:0}
.who h1{font-size:1.55rem;color:var(--robe)}
.who span{color:var(--muted);font-size:.9rem}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-family:var(--f-display);font-weight:400;font-size:1rem}
.yeop{width:15px;height:15px;border-radius:50%;background:var(--gold);position:relative;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.yeop::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;transform:translate(-50%,-50%);background:var(--card)}

/* 무대 */
.stage{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:400/270;max-width:100%;background:#CFE3EA;border:2px solid var(--line);user-select:none;-webkit-user-select:none}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
:root[data-theme="dark"] .stage svg.scene{filter:brightness(.82) saturate(.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage svg.scene{filter:brightness(.82) saturate(.9)}}
.hero{position:absolute;left:50%;bottom:3%;width:30%;transform:translateX(calc(-50% + var(--x,0px)));transition:transform 2.6s ease-in-out;background:none;border:0;padding:0;z-index:3}
.hero .bob{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.hero.flip svg{transform:scaleX(-1)}
.hero.hop .bob{animation:hop .45s ease-out 1}
.hero svg{width:100%;height:auto;display:block;overflow:visible}
.eyes{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-14%) scale(1.03,.97)}100%{transform:translateY(0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{position:absolute;left:50%;bottom:58%;transform:translateX(calc(-50% + var(--x,0px)));background:#FFFDF8;color:#3A2E28;border:2px solid #5A3E33;border-radius:16px;padding:5px 12px;font-size:.92rem;max-width:62%;text-align:center;z-index:4;transition:opacity .3s,transform 2.6s ease-in-out;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#FFFDF8;border-right:2px solid #5A3E33;border-bottom:2px solid #5A3E33;transform:translateX(-50%) rotate(45deg)}
.bubble[data-off]{opacity:0}
.mote{position:absolute;width:34px;height:34px;border-radius:50%;border:0;padding:0;z-index:5;background:radial-gradient(circle at 50% 45%,#FFF7D6 0 28%,rgba(255,214,120,.75) 45%,rgba(255,214,120,0) 70%);animation:float 3s ease-in-out infinite}
.mote::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#F4C25A;box-shadow:inset 0 0 0 2px rgba(120,80,20,.35)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pop{position:absolute;z-index:6;font-family:var(--f-display);color:#8A5A12;background:#FFF4D2;border-radius:10px;padding:0 6px;pointer-events:none;animation:popup 1s ease-out forwards}
@keyframes popup{to{transform:translateY(-30px);opacity:0}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.fx i{position:absolute;top:-6%;display:block;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx,20px),118%) rotate(260deg)}}
.stagebar{position:absolute;left:10px;top:10px;z-index:4;display:flex;gap:6px}
.stagebar .pill{background:rgba(255,253,248,.88);color:#3A2E28;border-color:rgba(90,62,51,.2)}
.stagebar button.pill{cursor:pointer}

/* 게이지 */
.gauges{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.apt-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.apt-head h3{font-size:1.05rem}
.apt-head .tier{font-family:var(--f-display);color:var(--robe);font-size:1.1rem}
.bar{height:12px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--robe);transition:width .5s}
.apt .bar{height:16px}
.apt .bar>i{background:linear-gradient(90deg,var(--gold),var(--robe))}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:3px}
.karma .bar{position:relative;background:linear-gradient(90deg,color-mix(in srgb,var(--red) 22%,var(--card2)),var(--card2) 50%,color-mix(in srgb,var(--green) 22%,var(--card2)))}
.karma .mark{position:absolute;top:-3px;width:6px;height:16px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .5s}
.karma .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.mini b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:400}
.mini .bar{height:8px}
.lbl{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);margin-bottom:4px}
.lbl b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}

/* 탭 */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.tabs button{border:0;background:none;border-radius:12px;padding:8px 2px;font-family:var(--f-display);font-size:.98rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--robe);color:var(--on-accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:1.25rem}
.sub{color:var(--muted);font-size:.88rem;margin:0}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:2px dashed var(--line);background:var(--card2);border-radius:14px;padding:8px 6px;text-align:center;display:grid;gap:2px;justify-items:center}
.slot small{color:var(--muted);font-size:.78rem}
.slot .ic{font-size:1.5rem;line-height:1.2}
.slot .nm{font-family:var(--f-display);font-size:.95rem}
.slot[aria-pressed="true"]{border:2px solid var(--robe);background:color-mix(in srgb,var(--robe) 12%,var(--card))}
.grp{display:grid;gap:6px}
.grp h3{font-size:.95rem;color:var(--muted);letter-spacing:.06em}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.act{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 9px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center}
.act .ic{font-size:1.3rem;grid-row:span 2}
.act b{font-weight:400;font-family:var(--f-display);font-size:.98rem}
.act small{color:var(--muted);font-size:.74rem;line-height:1.3}
.act:hover{border-color:var(--robe)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 14px;font-family:var(--f-display);font-size:1rem}
.btn.primary{background:var(--robe);color:var(--on-accent);border-color:transparent;box-shadow:var(--shadow)}
.btn.big{width:100%;padding:13px;font-size:1.15rem}
.btn.sm{padding:5px 10px;font-size:.88rem}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:9px 11px;background:var(--card)}
.item .ic{font-size:1.6rem;width:36px;text-align:center}
.item b{font-family:var(--f-display);font-weight:400;font-size:1rem}
.item small{display:block;color:var(--muted);font-size:.78rem}
.item.badfood{background:color-mix(in srgb,var(--red) 7%,var(--card))}
.secret{border-top:2px dashed var(--line);padding-top:12px;display:grid;gap:8px}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.plot{border-radius:14px;padding:10px;min-height:118px;display:grid;gap:4px;align-content:space-between;justify-items:center;text-align:center;border:0;
  background:repeating-linear-gradient(0deg,#8A6446 0 6px,#7A5639 6px 12px);color:#FFF6E6}
.plot .ic{font-size:2rem;line-height:1}
.plot small{font-size:.8rem}
.plot .bar{width:100%;height:7px;background:rgba(255,255,255,.25);border:0}
.plot .bar>i{background:#9BD27E}
.plot.ready{box-shadow:0 0 0 3px var(--gold)}
.plot.empty{opacity:.92}
.seedrow{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 10px;font-size:.86rem}
.chip[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--card));}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.wears{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.wear{border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;gap:4px;justify-items:center;text-align:center;background:var(--card)}
.wear .ic{font-size:1.5rem}
.wear[data-on]{border:2px solid var(--robe)}
.wear small{color:var(--muted);font-size:.76rem}
.stats{display:grid;gap:9px}
.stat .lbl small{color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gal div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card2);font-size:.86rem}
.gal div b{display:block;font-family:var(--f-display);font-weight:400}
.gal div.lock{color:var(--muted);border-style:dashed}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kv span{background:var(--card2);border-radius:10px;padding:6px 10px;font-size:.86rem}
.kv b{font-weight:400;font-family:var(--f-display)}

/* 모달 */
#ov,#title{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(30,24,20,.5);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.mcard{width:min(440px,100%);background:var(--card);border-radius:22px;padding:18px;display:grid;gap:10px;border:2px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.25);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.mcard h2{font-size:1.35rem;text-align:center}
.mart{display:grid;place-items:center;background:linear-gradient(var(--card2),color-mix(in srgb,var(--gold) 14%,var(--card2)));border-radius:16px;padding:8px}
.artwrap{position:relative;width:130px}
.artwrap svg{width:100%;height:auto;display:block;overflow:visible}
.artwrap .badge{position:absolute;right:-18px;top:6px;font-size:2rem;background:var(--card);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--line)}
.mbody{display:grid;gap:6px}
.mbody p{margin:0}
.mbody .note{color:var(--muted);font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.d{border-radius:999px;padding:2px 9px;font-size:.84rem;font-variant-numeric:tabular-nums;border:1px solid}
.d.up{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 10%,transparent)}
.d.dn{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.mbtns{display:grid;gap:8px}
.choice{text-align:left;display:grid;gap:1px}
.choice small{font-family:var(--f-body);font-size:.8rem;opacity:.8}
.titlecard{width:min(460px,100%);background:var(--card);border-radius:26px;padding:24px 20px;display:grid;gap:12px;justify-items:center;text-align:center;border:2px solid var(--line)}
.titlecard h1{font-size:2.5rem;color:var(--robe);line-height:1.1}
.titlecard .artwrap{width:150px}
.titlecard input{font:inherit;font-size:1.1rem;text-align:center;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card2);color:var(--ink);width:min(220px,100%)}
.titlecard .btns{display:grid;gap:8px;width:min(280px,100%)}
.ending-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;font-size:.84rem}
.ending-stats span{background:var(--card2);border-radius:8px;padding:3px 6px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:9px 16px;max-width:min(92vw,440px);font-size:.92rem;text-align:center;transition:opacity .3s}
#toast[data-off]{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div class="left">
    <header class="top">
      <div class="who"><h1 id="nm">동자스님</h1><span id="age"></span></div>
      <div class="meta">
        <span class="pill" id="date"></span>
        <span class="pill" title="엽전"><i class="yeop"></i><b id="coin">0</b></span>
        <span class="pill" title="남은 번뇌(일정 칸) 수">번뇌 <b id="bn">108</b></span>
      </div>
    </header>
    <section class="stage" id="stage" aria-label="절 마당">
      <div id="scene"></div>
      <div class="fx" id="fx"></div>
      <div class="stagebar"><span class="pill" id="season"></span><button class="pill" id="snd" aria-label="소리 켜고 끄기"></button></div>
      <div class="bubble" id="bubble" data-off></div>
      <button class="hero" id="hero" aria-label="동자스님 쓰다듬기"><div class="bob" id="heroArt"></div></button>
    </section>
    <section class="gauges" aria-label="상태">
      <div class="apt">
        <div class="apt-head"><h3>스님 자질</h3><span class="tier" id="tier"></span></div>
        <div class="bar" role="meter" aria-valuemin="0" aria-valuemax="100" id="aptbar"><i></i></div>
        <div class="ticks"><span>아기 행자</span><span>꼬마 행자</span><span>어엿한 사미</span><span>의젓한 사미</span><span>큰스님 재목</span></div>
      </div>
      <div class="karma">
        <div class="lbl"><span>악업</span><span>카르마 <b id="karmaV">0</b></span><span>선업</span></div>
        <div class="bar"><span class="mid"></span><span class="mark" id="karmaM"></span></div>
      </div>
      <div class="row3">
        <div class="mini"><label>배부름 <b id="fullV"></b></label><div class="bar"><i id="fullB" style="background:var(--gold)"></i></div></div>
        <div class="mini"><label>기분 <b id="moodV"></b></label><div class="bar"><i id="moodB" style="background:var(--pink)"></i></div></div>
        <div class="mini"><label>피로 <b id="tiredV"></b></label><div class="bar"><i id="tiredB" style="background:var(--blue)"></i></div></div>
      </div>
    </section>
  </div>
  <div class="right">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <section class="panel" id="panel" role="tabpanel"></section>
  </div>
</div>
<div id="ov" hidden></div>
<div id="title" hidden></div>
<div id="toast" data-off></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SAVE='dongja-save-v1', GAL='dongja-endings-v1', SND='dongja-sound-v1';
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const STAT_KEYS=['wis','pat','com','str','dex','wit'];
const NAME={wis:'지혜',pat:'인내',com:'자비',str:'체력',dex:'손재주',wit:'엉뚱함',karma:'카르마',full:'배부름',mood:'기분',tired:'피로',coin:'엽전'};
const DESC={wis:'경전을 이해하고 깨닫는 힘',pat:'졸음과 다리 저림을 견디는 힘',com:'남을 아끼고 돕는 마음',str:'108배도 거뜬한 튼튼함',dex:'연등과 염주를 빚는 솜씨',wit:'모두를 웃게 하는 엉뚱함'};
const SLOT_N=['상순','중순','하순'];
const SEASON_N={spring:'봄',summer:'여름',autumn:'가을',winter:'겨울'};

const CROPS={
  lettuce:{n:'상추',ic:'🌿',cost:3,grow:6,yield:2},
  potato:{n:'감자',ic:'🥔',cost:5,grow:12,yield:3},
  goguma:{n:'고구마',ic:'🍠',cost:6,grow:12,yield:3},
  cabbage:{n:'배추',ic:'🥬',cost:8,grow:16,yield:2},
  lotus:{n:'연근',ic:'🪷',cost:12,grow:24,yield:2},

function applyFx(fx,mult=1){
  const d={};
  for(const k in fx){let v=fx[k];
    if(STAT_KEYS.includes(k)){if(v>0)v=Math.max(1,Math.round(v*mult*(1-S.st[k]/130)));const o=S.st[k];S.st[k]=clamp(o+v,0,100);d[k]=S.st[k]-o}
    else if(k==='karma'){if(v>0&&S.karma>0)v=Math.max(1,Math.round(v*(1-S.karma/160)));const o=S.karma;S.karma=clamp(o+v,-100,100);d[k]=S.karma-o}
    else if(k==='coin'){const o=S.coin;S.coin=Math.max(0,o+v);d[k]=S.coin-o}
    else if(k==='full'||k==='mood'||k==='tired'){const o=S[k];S[k]=clamp(o+v,0,100);d[k]=S[k]-o}
  }
  return d;
}

async function runSlot(i){
  let id=S.slots[i], a=ACTS[id]; const notes=[];
  S.full=clamp(S.full-12,0,100);
  if(S.tired>=95){a=SICK;id='sick'}
  else if(S.mood<=10&&!['nap','hill','prank'].includes(id)&&Math.random()<.5){notes.push(`기분이 너무 안 좋아서 ${a.n} 대신 몰래 장난을 쳤어요.`);id='prank';a=ACTS.prank}
  let mult=1;
  if(!['nap','hill','prank','sick'].includes(id)){
    if(S.tired>=80){mult*=.5;notes.push('너무 피곤해서 꾸벅꾸벅… 성과가 줄었어요.')}
    if(S.full<=10){mult*=.5;notes.push('배가 고파서 집중이 안 됐어요. 공양을 챙겨 주세요.')}
    else if(S.full>=70){mult*=1.1;notes.push('배가 든든해서 힘이 났어요!')}
    if(S.mood<=15){mult*=.7;notes.push('시무룩해서 영 신이 안 났어요.')}
    else if(S.mood>=80){mult*=1.1}
  }
  const d=applyFx(a.fx,mult);
  let text=pick(a.say);
  if(id==='lantern'){const q=clamp(S.st.dex+rand(-5,25),5,100);S.lanterns.push(q);S.cnt.craft++;S.flags.lantern=1;notes.push(`연등 하나 완성! 솜씨 ${q}점.`)}
  if(id==='beads'){S.beads++;S.cnt.craft++;notes.push('염주 하나 완성!')}
  if(id==='buddha'&&Math.random()<.18){merge(d,applyFx({karma:3,mood:5}));notes.push('부처님이 빙그레 웃으신 것 같아요!')}
  if(id==='hill'&&Math.random()<.3){S.inv.lettuce++;notes.push('산나물을 한 줌 뜯어 왔어요. (상추 +1)')}
  if(id==='hill')S.flags.hill=1;
  if(id==='prank'){S.cnt.prank++;if(Math.random()<.3){S.cnt.caught++;merge(d,applyFx({karma:-2,mood:-12,pat:1}));notes.push('앗, 주지스님께 딱 걸렸어요! 꿀밤 한 대.')}}
  if(id==='errand'&&S.st.com>=40&&Math.random()<.4){merge(d,applyFx({coin:10}));notes.push('착하다며 엽전을 더 얹어 주셨어요.')}
  merge(d,applyFx({tired:-3}));
  growAll(season()==='winter'?1:2); if(id==='farm')growAll(5);
  S.cnt[id]=(S.cnt[id]||0)+1;
  tok(id==='yebul'?620:820);
  render();
  await modal({title:`${SLOT_N[i]} · ${a.n}`,art:art(a.ic),body:p(text)+notes.map(n=>`<p class="note">${n}</p>`).join(''),chips:d});
}
async function runEvent(ev){
  ev.pre&&ev.pre();
  if(ev.choices){
    const i=await modal({title:ev.title,art:ev.art,body:p(ev.text),choices:ev.choices});
    const c=ev.choices[i]; const fx=typeof c.fx==='function'?c.fx():c.fx; const d=fx?applyFx(fx):{};
    c.after&&c.after(d);
    render();
    await modal({title:ev.title,art:ev.art,body:p(typeof c.res==='function'?c.res():c.res),chips:d});
  } else {
    const d=ev.fx?applyFx(ev.fx):{}; ev.after&&ev.after(d); render();
    await modal({title:ev.title,art:ev.art,body:p(ev.text),chips:d});
  }
  render();

function decideEnding(){
  const s=S.st, a=apt();
  if(S.karma<=-40) return 'dokkaebi';
  if(a>=72&&S.karma>=55&&Math.min(s.wis,s.pat,s.com)>=55) return 'heir';
  if(S.cnt.bad>=15) return 'mukbang';
  const c=[];
  if(s.pat>=70&&s.wis>=45) c.push(['zen',s.pat]);
  if(s.wis>=70) c.push(['scholar',s.wis]);
  if(s.com>=70&&S.karma>=20) c.push(['mercy',s.com]);
  if(s.dex>=70||S.cnt.craft>=24) c.push(['artisan',Math.max(s.dex,S.cnt.craft*3)]);
  if(S.cnt.harvest>=18&&s.str>=45) c.push(['farmer',s.str+S.cnt.harvest]);
  if(s.wit>=70) c.push(['jester',s.wit]);
  if(!c.length) return 'normal';
  c.sort((x,y)=>y[1]-x[1]); return c[0][0];
}

  return {
    heir:`스무 해가 흐른 뒤, 산사의 새벽 종은 ${n} 스님이 울립니다.\n어린 날 졸린 눈을 비비며 올리던 예불, 마당을 쓸던 싸리비, 할머니께 드린 연등. 그 모든 날이 모여 큰스님의 자리를 이었어요.\n오늘도 ${n} 스님은 장난꾸러기 동자스님의 머리를 쓰다듬으며 말합니다. "배고프면 밥부터 먹거라."`,
    dokkaebi:`장난이 조금, 아니 많이 지나쳤나 봐요.\n${N}는 결국 산을 내려가 마을 학교에 다니게 되었어요. 별명은 '절에서 온 도깨비'.\n그래도 초파일이면 꼭 절에 올라와 불상을 닦고 간대요. 큰스님은 그 모습을 보며 허허 웃으십니다.`,
    mukbang:`몰래 먹던 컵라면의 맛을 끝내 잊지 못한 ${n} 스님.\n어른이 되어 연 '사찰음식 먹방' 채널이 대박이 났어요. 나물 비빔밥 한 그릇에 구독자 100만!\n다만 고기만두 영상은 큰스님께 들켜 하루 만에 내려갔다는 소문이에요.`,
    zen:`${n} 스님은 한번 앉으면 다람쥐가 머리 위에 올라와도 꿈쩍하지 않는 선승이 되었어요.\n사람들은 '바위 스님'이라 부르며 먼 길을 찾아와 함께 앉아 있다 갑니다.\n가끔 아주 가끔, 코끝에 앉은 파리 때문에 웃음을 참는다는 건 비밀이에요.`,
    scholar:`경전 한 권을 통째로 외운 ${N}는 커서 이름난 학승이 되었어요.\n어려운 한자를 쉬운 말로 풀어 주는 ${n} 스님의 책은 아이들 머리맡에 한 권씩 놓여 있대요.\n첫 장에는 이렇게 적혀 있어요. "배고프면 밥을 먹을 것."`,
    mercy:`${n} 스님이 지나가면 마을 할머니들이 손을 흔들고, 아기 고양이들이 줄지어 따라와요.\n아픈 사람 곁에 앉아 이야기를 들어 주는 스님. 사람들은 그 미소만 봐도 마음이 놓인다고 해요.\n어린 시절 흰죽을 나눠 주던 그 마음 그대로예요.`,
    artisan:`${n} 스님이 만든 연등은 해마다 축제의 한가운데에 걸려요.\n한지 꽃잎 한 장 한 장에 정성을 담는 연등 장인 스님. 멀리서 배우러 오는 사람도 많대요.\n첫 작품, 삐뚤빼뚤한 그 연등은 지금도 방 한쪽에 걸려 있어요.`,
    farmer:`${n} 스님의 텃밭에선 사계절 내내 무언가가 자라요.\n봄엔 상추, 여름엔 감자, 가을엔 고구마, 겨울엔 김장 배추. 수확한 작물은 모두 마을과 나눠요.\n흙 묻은 손으로 합장하는 텃밭 스님, 오늘도 지렁이에게 먼저 인사합니다.`,
    jester:`${n} 스님의 법문 시간은 언제나 웃음바다예요.\n목탁 비트박스, 염주 저글링, 그리고 마지막엔 꼭 마음에 남는 한마디. 사람들은 '웃음 전도사 스님'이라 부릅니다.\n큰스님도 몰래 맨 뒷줄에서 듣고 가신대요.`,
    normal:`특별히 대단한 일은 없었지만, ${N}는 무럭무럭 자라 착한 사미승이 되었어요.\n새벽엔 예불을 올리고, 낮엔 마당을 쓸고, 저녁엔 별을 봅니다.\n큰스님은 말씀하셨어요. "평범한 하루를 잘 사는 것, 그게 수행이란다."`,
  }[k];
}
async function ending(){
  const k=decideEnding(), e=ENDINGS[k];
  S.done=k; save();
  const gal=load(GAL)||{}; const fresh=!gal[k]; gal[k]=S.name; store(GAL,gal);
  render();
  const stats=STAT_KEYS.map(s=>`<span>${NAME[s]} ${S.st[s]}</span>`).join('');
  await modal({title:`엔딩 · ${e.t}`,art:art(e.ic),body:p(endingText(k))+`<div class="ending-stats">${stats}</div><p class="note" style="text-align:center">스님 자질 ${apt()} · 카르마 ${S.karma>0?'+':''}${S.karma}${fresh?' · 새 엔딩을 도감에 기록했어요':''} · 도감 ${Object.keys(gal).length}/${Object.keys(ENDINGS).length}</p>`,btn:'새 동자스님 맞이하기'});
  showTitle();
}

/* ---------- 상호작용 ---------- */
function say(){
  if(S.full<=20) return pick(['배고파요… 꼬르륵','스님, 공양 시간 아직이에요?']);
  if(S.tired>=75) return pick(['하암… 졸려요','눈꺼풀이 천 근이에요']);
  if(S.mood<=25) return pick(['힝…','오늘은 아무것도 하기 싫어요']);
  if(S.karma<=-30) return pick(['히히, 아무도 못 봤겠지?','라면… 또 먹고 싶다']);
  if(S.karma>=50&&Math.random()<.5) return pick(['오늘은 마음이 참 맑아요','부처님이 웃으시는 것 같아요']);
  const se={spring:['꽃잎이 머리에 붙었어요!','봄바람 냄새가 좋아요'],summer:['더워요, 개울 가고 싶다','매미가 경전을 외우나 봐요'],autumn:['낙엽 밟는 소리 좋아요','고구마 구워 먹고 싶어요'],winter:['코가 시려요','눈사람 만들고 싶어요']}[season()];
  return pick([...se,'스님, 오늘은 뭐 해요?','똑똑똑, 목탁 소리','머리 쓰다듬어 주세요','저 키 컸어요?']);
}
function onHero(){
  if(!S||UI.busy)return;
  const h=$('#hero'); h.classList.remove('hop'); void h.offsetWidth; h.classList.add('hop');
  tok(); bubble(say());
  if(S.taps>0){S.taps--; if(Math.random()<.5){S.coin++;popAt(h,'+1');} S.mood=clamp(S.mood+1,0,100); save(); render()}
}
function popAt(el,txt){const st=$('#stage').getBoundingClientRect(),r=el.getBoundingClientRect();const s=document.createElement('span');s.className='pop';s.textContent=txt;s.style.left=(r.left-st.left+r.width/2-10)+'px';s.style.top=(r.top-st.top)+'px';$('#stage').appendChild(s);setTimeout(()=>s.remove(),1000)}
function spawnMote(){
  if(!S||document.hidden||document.querySelectorAll('.mote').length>=3)return;
  const b=document.createElement('button');b.className='mote';b.setAttribute('aria-label','공덕 방울 줍기');
  b.style.left=rand(6,86)+'%';b.style.top=rand(8,46)+'%';
  b.onclick=()=>{const v=rand(1,3);S.coin+=v;popAt(b,'+'+v);tok(1100);b.remove();save();render()};
  $('#stage').appendChild(b);
  setTimeout(()=>b.remove(),45000);
}
function wander(){
  if(!S||UI.busy)return;
  const x=rand(-70,70), h=$('#hero'), cur=parseFloat(h.style.getPropertyValue('--x'))||0;
  h.classList.toggle('flip',x<cur);
  h.style.setProperty('--x',x+'px'); $('#bubble').style.setProperty('--x',x+'px');
}
let rtAcc=0;
function tick(){
  if(!S||S.done)return;
  rtAcc++;
  if(rtAcc%120===0){growAll(1);S.coin++;save();if(['farm'].includes(UI.tab)&&!UI.busy)render();else{$('#coin').textContent=S.coin}}
  if(rtAcc%22===0)spawnMote();
  if(rtAcc%7===0)wander();
  if(rtAcc%15===0)save();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||!S)return;
  const ds=t.dataset;
  if(ds.tab){UI.tab=ds.tab;UI.reset=false;renderTabs();renderPanel();return}
  if(ds.slot!==undefined){UI.slot=+ds.slot;renderPanel();return}
  if(ds.actpick){S.slots[UI.slot]=ds.actpick;UI.slot=(UI.slot+1)%3;save();renderPanel();return}
  if('run' in ds){runMonth();return}
  if(ds.eat){eat(ds.eat);return}
  if(ds.seed){UI.seed=ds.seed;renderPanel();return}
  if(ds.plot!==undefined){plot(+ds.plot);return}
  if('expand' in ds){const c=plotCost();if(S.coin>=c){S.coin-=c;S.plots.push({c:null,g:0});toast('밭이 한 뙈기 늘었어요!');save();render()}return}
  if(ds.sell){sell(ds.sell,false);return}
  if(ds.offer){sell(ds.offer,true);return}
  if(ds.buy){const [cat,id]=ds.buy.split(':');const it=WEAR[cat].list.find(x=>x.id===id);if(S.coin>=it.cost){S.coin-=it.cost;own(cat,id);S.wear[cat]=id;toast(`${it.n}을(를) 샀어요!`);tok(1000);save();render()}return}
  if(ds.wear){const [cat,id]=ds.wear.split(':');S.wear[cat]=id;save();render();bubble(pick(['어때요, 잘 어울려요?','헤헤, 멋지죠?']));return}
  if(ds.reset){if(ds.reset==='ask')UI.reset=true;else if(ds.reset==='no')UI.reset=false;else{UI.reset=false;try{localStorage.removeItem(SAVE)}catch(e){}S=null;showTitle();return}renderPanel();return}
});
$('#hero').addEventListener('click',onHero);
$('#snd').addEventListener('click',()=>{sound=!sound;store(SND,sound);$('#snd').textContent=sound?'소리 켬':'소리 끔';if(sound)tok()});

function eat(id){
  const m=MEALS.find(x=>x.id===id)||BAD.find(x=>x.id===id), bad=BAD.includes(m);
  if(S.full>=95){toast('배불러서 더는 못 먹겠어요');bubble('배불러요…');return}
  if(!canEat(m))return;
  if(m.need)for(const k in m.need)S.inv[k]-=m.need[k];
  if(m.cost)S.coin-=m.cost;
  const d=applyFx(m.fx);
  if(bad){S.cnt.bad++;
    if(Math.random()<.25){S.cnt.caught++;merge(d,applyFx({karma:-2,mood:-10,pat:1}));save();render();
      modal({title:'딱 걸렸다!',art:art(m.ic),body:p(`${m.n}을(를) 먹다가 주지스님과 눈이 마주쳤어요.\n"…맛있느냐?" 꿀밤 한 대와 함께 반성문 한 장.`),chips:d});return}
  } else S.cnt.meal++;
  tok(700); bubble(bad?pick(['쉿… 맛있다','히히, 비밀이에요']):pick(['잘 먹겠습니다!','냠냠, 맛있어요','배가 든든해요']));
  toast(`${m.ic} ${m.n} 냠냠 · `+Object.entries(d).filter(([k,v])=>v).map(([k,v])=>`${NAME[k]} ${v>0?'+':''}${v}`).join(', '));
  save(); render();
}
function plot(i){
  const pl=S.plots[i];
  if(!pl.c){const c=CROPS[UI.seed];if(S.coin<c.cost){toast(`엽전이 모자라요. ${c.n} 씨앗은 ${c.cost}닢이에요.`);return}S.coin-=c.cost;pl.c=UI.seed;pl.g=0;toast(`${c.ic} ${c.n}을(를) 심었어요`);save();render();return}
  const c=CROPS[pl.c];
  if(pl.g<c.grow){toast(`${c.n}이(가) 아직 자라는 중이에요`);return}
  const y=c.yield+(S.st.str>=50?1:0); S.inv[pl.c]+=y; S.cnt.harvest++; pl.c=null; pl.g=0;
  const d=applyFx({mood:4}); tok(900); toast(`${c.ic} ${c.n} ${y}개 수확! 기분 +${d.mood||0}`); bubble('우와, 풍년이에요!'); save(); render();
}
function sell(kind,offer){
  let d={};
  if(kind==='lantern'){if(!S.lanterns.length)return;const low=Math.min(...S.lanterns);S.lanterns.splice(S.lanterns.indexOf(low),1);d=applyFx(offer?{karma:2,com:1}:{coin:5+Math.floor(low/5)})}
  else{if(!S.beads)return;S.beads--;d=applyFx(offer?{karma:2,wis:1}:{coin:12})}
  toast((offer?'불전에 올렸어요 · ':'팔았어요 · ')+Object.entries(d).filter(([k,v])=>v).map(([k,v])=>`${NAME[k]} +${v}`).join(', '));
  tok(offer?600:1000); save(); render();
}

/* ---------- 타이틀 ---------- */
function showTitle(){
  const sv=load(SAVE); const gal=load(GAL)||{};
  const T=$('#title');
  const demo={wear:{hat:'none',robe:'orange',item:'none'},mood:80,karma:0,full:80,tired:0};
  T.innerHTML=`<div class="titlecard"><div class="artwrap">${charSVG(demo)}</div><h1>동자스님 키우기</h1>
   <p class="sub">산사에 들어온 여섯 살 동자스님과 함께하는 3년. 일정을 짜고, 밥을 챙기고, 텃밭을 가꾸며 108번의 번뇌를 지나 보내요.</p>
   ${sv&&!sv.done?`<div class="btns"><button class="btn primary big" id="cont">${sv.name} 스님 이어서 키우기</button><button class="btn" id="fresh">새로 시작하기</button></div>`:
   `<label for="nameInput" class="sub">동자스님의 이름을 지어 주세요</label><input id="nameInput" maxlength="6" value="${pick(['도담','보리','연우','소담','다솜','해동'])}" autocomplete="off"><div class="btns"><button class="btn primary big" id="start">절에 들어가기</button></div>`}
   <p class="sub">엔딩 도감 ${Object.keys(gal).length} / ${Object.keys(ENDINGS).length}</p></div>`;
  T.hidden=false;
  const c=$('#cont'), f=$('#fresh'), s=$('#start');
  if(c)c.onclick=()=>{S=sv;migrate();T.hidden=true;lastSeason='';welcomeBack();render()};
  if(f)f.onclick=()=>{try{localStorage.removeItem(SAVE)}catch(e){}showTitle()};
  if(s){const go=async()=>{const n=($('#nameInput').value||'').trim().slice(0,6)||'도담';newGame(n);T.hidden=true;lastSeason='';UI.tab='plan';UI.slot=0;save();render();tok();
      await modal({title:'산사에 온 걸 환영한다',art:art('🍵'),body:p(`큰스님: "오늘부터 너는 ${nm()}다. 이곳에서 세 해를 지내며 무엇이 될지는 네 마음에 달렸단다."\n일정에서 한 달 계획을 세우고, 공양에서 밥을 챙겨 주세요. 착한 밥은 텃밭에서, 나쁜 밥은 몰래.\n화면을 켜 두면 마당에 공덕 방울이 떠올라요. 눌러서 엽전을 모으세요.`),btn:'시작하기'});
      bubble('잘 부탁드려요, 스님!')};
    s.onclick=go;$('#nameInput').onkeydown=e=>{if(e.key==='Enter')go()}}
}
function migrate(){S.cnt=Object.assign({bad:0,craft:0,harvest:0,prank:0,meal:0,caught:0},S.cnt||{});S.flags=S.flags||{};S.seen=S.seen||{}}
function welcomeBack(){
  const el=(Date.now()-(S.lastSeen||Date.now()))/1000;
  const g=Math.min(Math.floor(el/120),30), c=Math.min(Math.floor(el/90),100);
  if(g>0||c>0){growAll(g);S.coin+=c;save();toast(`기다리는 동안 텃밭이 자라고 시주함에 엽전 ${c}닢이 모였어요`)}
}

/* ---------- 시작 ---------- */
function boot(data){
  if(data&&data.S){S=data.S;migrate();$('#title').hidden=true;render()}
  else{const sv=load(SAVE);
    if(sv&&!sv.done){S=sv;migrate();render();showTitle()}
    else{newGame('도담');render();showTitle();S=null}
  }
  setInterval(tick,1000);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</html>
